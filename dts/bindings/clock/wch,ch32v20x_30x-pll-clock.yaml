description: WCH CH32V20x/30x PLL

compatible: "wch,ch32v20x_30x-pll-clock"

include: [clock-controller.yaml, base.yaml]

properties:
  "#clock-cells":
    const: 0

  clocks:
    type: phandle-array
    required: true

  hsi-pre-div:
    type: int
    default: 1
    description: |
        Divider applied to the HSI before it reaches the PLL, selected by
        EXTEN_CTR PLL_HSI_PRE. Only meaningful when the PLL is clocked from
        the HSI; ignored for an HSE-sourced PLL.

        1 feeds the PLL the full HSI (the vendor SDK's choice for its
        high-frequency recipes, e.g. 8 MHz x18 = 144 MHz) and 2 feeds it
        HSI/2, which is the hardware reset state.

        The default is 1 so that "mul" multiplies the HSI frequency as
        written. Note this bit is NOT restored by a warm reset, so a driver
        that does not write it inherits whatever the bootloader or the
        previously running image left -- which made SYSCLK differ between
        boots of the same image before this property existed.
    enum:
      - 1
      - 2

  mul:
    type: int
    required: true
    description: |
        Main PLL multiplication factor
    enum:
      - 2   # x2
      - 3   # x3
      - 4   # x4
      - 5   # x5
      - 6   # x6
      - 7   # x7
      - 8   # x8
      - 9   # x2
      - 10  # x10
      - 11  # x11
      - 12  # x12
      - 13  # x13
      - 14  # x14
      - 15  # x15
      - 16  # x16
      - 18  # x18
